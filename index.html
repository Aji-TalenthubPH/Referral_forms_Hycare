<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HyCare Referral Form App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f3f9;--card:#fff;--ink:#1d1a26;--mut:#6b6577;--pur:#7a4a9c;--navy:#20105d;--line:#d9d1e3;--soft:#efeaf4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17131f;--card:#211b2e;--ink:#eee9f6;--mut:#a79fb8;--line:#3a3150;--soft:#2c2340;--navy:#cfc3f5;--pur:#a77bd0}}
:root[data-theme=dark]{--bg:#17131f;--card:#211b2e;--ink:#eee9f6;--mut:#a79fb8;--line:#3a3150;--soft:#2c2340;--navy:#cfc3f5;--pur:#a77bd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{height:46px;background:#fff;border-radius:6px;padding:2px 6px}header b{color:var(--navy);font-size:18px}header small{display:block;color:var(--pur);font-style:italic;font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
h2{margin:0;padding:9px 14px;background:var(--pur);color:#fff;font-size:15px}
h3{margin:0;padding:6px 14px;background:var(--soft);color:var(--mut);font-size:13px}
.b{padding:12px 14px;display:grid;gap:10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
label,legend{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
input[type=text],input[type=date],textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
fieldset{border:0;margin:0;padding:0}.o{display:flex;flex-wrap:wrap;gap:6px 16px}.o label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;margin:0}
.o input[type=text]{width:130px;padding:4px 6px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--line);padding:3px}th{font-size:12px;color:var(--mut);text-align:left;padding:5px}td input{border:0!important;background:transparent!important;padding:5px!important}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--pur);background:var(--pur);color:#fff;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--pur)}
#m{font-size:13px;color:var(--mut)}
.sig-canvas{border:1px solid var(--line);border-radius:6px;background:#fff;touch-action:none;cursor:crosshair;width:100%;max-width:360px;height:120px;display:block}
.sig-actions{margin-top:4px;display:flex;gap:8px;align-items:center}
.sig-actions button{padding:4px 10px;font-size:13px;font-weight:500}
#previewModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:16px}
#previewModal.open{display:flex}
#previewBox{background:var(--card);border-radius:12px;width:100%;max-width:920px;height:92vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
#previewBox > header{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--card)}
#previewFrame{flex:1;border:0;width:100%;background:#fff}
</style></head><body>
<header><img alt="HyCare" src="data:image/png;base64,...[logo truncated for brevity, full in original]"><div style="text-align:right"><b>Referral Form</b><small>NDIS Provider | Called to Care</small></div></header>
<main id="f"></main>
<div class="bar"><button id="go">Generate filled PDF</button><button class="s" id="prev">Preview</button><button class="s" id="clr">Clear form</button><span id="m"></span></div>
<div id="previewModal"><div id="previewBox"><header><b>PDF Preview</b><div><button class="s" id="openTab">Open in new tab</button> <button class="s" id="closePrev">Close</button></div></header><embed id="previewFrame" type="application/pdf" style="flex:1;width:100%;border:0"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
