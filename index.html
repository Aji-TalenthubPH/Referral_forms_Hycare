<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HyCare Referral Form App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f3f9;--card:#fff;--ink:#1d1a26;--mut:#6b6577;--pur:#7a4a9c;--navy:#20105d;--line:#d9d1e3;--soft:#efeaf4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17131f;--card:#211b2e;--ink:#eee9f6;--mut:#a79fb8;--line:#3a3150;--soft:#2c2340;--navy:#cfc3f5;--pur:#a77bd0}}
:root[data-theme=dark]{--bg:#17131f;--card:#211b2e;--ink:#eee9f6;--mut:#a79fb8;--line:#3a3150;--soft:#2c2340;--navy:#cfc3f5;--pur:#a77bd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{height:46px;background:#fff;border-radius:6px;padding:2px 6px}header b{color:var(--navy);font-size:18px}header small{display:block;color:var(--pur);font-style:italic;font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
h2{margin:0;padding:9px 14px;background:var(--pur);color:#fff;font-size:15px}
h3{margin:0;padding:6px 14px;background:var(--soft);color:var(--mut);font-size:13px}
.b{padding:12px 14px;display:grid;gap:10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
label,legend{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
input[type=text],input[type=date],textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
fieldset{border:0;margin:0;padding:0}.o{display:flex;flex-wrap:wrap;gap:6px 16px}.o label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;margin:0}
.o input[type=text]{width:130px;padding:4px 6px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--line);padding:3px}th{font-size:12px;color:var(--mut);text-align:left;padding:5px}td input{border:0!important;background:transparent!important;padding:5px!important}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--pur);background:var(--pur);color:#fff;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--pur)}
#m{font-size:13px;color:var(--mut)}
#pv{position:fixed;inset:0;background:rgba(20,15,30,.85);z-index:50;display:flex;flex-direction:column}#pv[hidden]{display:none}
.ph{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.ph b{color:var(--navy)}
#pc{overflow:auto;flex:1;padding:12px}#pc canvas{display:block;margin:0 auto 12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:100%}
</style></head><body>

  const l=el('label'),c=el('input');c.type='checkbox';c.dataset.id=e.id;c.dataset.g=e.ctx;if(e.radio)c.onchange=()=>{if(c.checked)fs.querySelectorAll('input[type=checkbox]').forEach(x=>{if(x!==c)x.checked=false})};
  l.append(c,e.label);if(e.tx!=null){const t=el('input');t.type='text';t.dataset.o=e.id;t.placeholder='details';t.oninput=()=>{if(t.value)c.checked=true};l.append(t)}
  fs.querySelector('.o').append(l)}
 else if(e.t=='tbl'){fs=null;grid=null;const b=ensureBody();const t=el('table'),h=el('tr');e.cols.forEach(c=>h.append(el('th','',c.replace('*',''))));t.append(h);
  e.rows.forEach((r,ri)=>{const tr=el('tr');r.forEach((_,ci)=>{const td=el('td'),i=el('input');i.type='text';i.dataset.t=ri+'-'+ci;td.append(i);tr.append(td)});t.append(tr)});b.append(t)}
}
const tbl=REG.find(e=>e.t=='tbl');
const clean=s=>s.replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/[^\x20-\x7E\xA0-\xFF\n]/g,'?');
const fmt=(v,l)=>{const x=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v);return x&&isDate(l)?`${x[3]}/${x[2]}/${x[1]}`:v};
function wrap(f,txt,sz,widths){const out=[];let i=0;for(const para of txt.split('\n')){let cur='';for(const w of para.split(/\s+/)){const t=cur?cur+' '+w:w,W=widths[Math.min(out.length,widths.length-1)];if(f.widthOfTextAtSize(t,sz)<=W||!cur)cur=t;else{out.push(cur);cur=w}}out.push(cur)}return out}
async function make(){
 const {PDFDocument,StandardFonts,rgb}=PDFLib;const doc=await PDFDocument.load(Uint8Array.from(atob(PDF),c=>c.charCodeAt(0)));
 const f=await doc.embedFont(StandardFonts.Helvetica),pg=doc.getPages(),ink=rgb(.05,.1,.5);
 const put=(p,x,y,t,sz)=>pg[p-1].drawText(t,{x,y,size:sz,font:f,color:ink});
 const q=s=>document.querySelector(s);
 for(const e of REG){
  if(e.t=='text'){let v=q(`[data-id="${e.id}"]`).value.trim();if(!v)continue;v=clean(fmt(v,e.label));
   const ws=e.lines.map(l=>l[3]-4);
   if(!e.multi){let sz=9.5;while(sz>6&&f.widthOfTextAtSize(v,sz)>ws[0])sz-=.5;put(e.lines[0][0],e.lines[0][1]+2,e.lines[0][2]+3,v,sz)}
   else{let sz=9.5,ls;for(;sz>=6;sz-=.5){ls=wrap(f,v,sz,ws);if(ls.length<=e.lines.length)break}
    ls.slice(0,e.lines.length).forEach((t,i)=>{const L=e.lines[i];put(L[0],L[1]+2,L[2]+3,t,Math.max(sz,6))})}}
  else if(e.t=='chk'){const c=q(`[data-id="${e.id}"]`),o=q(`[data-o="${e.id}"]`),tv=o?clean(o.value.trim()):'';
   if(c.checked||tv){const P=pg[e.p-1],o2={thickness:1.4,color:ink};P.drawLine({start:{x:e.x+1.5,y:e.y+.2},end:{x:e.x+7,y:e.y+6.3},...o2});P.drawLine({start:{x:e.x+1.5,y:e.y+6.3},end:{x:e.x+7,y:e.y+.2},...o2})}
   if(tv){let sz=9;while(sz>6&&f.widthOfTextAtSize(tv,sz)>e.tw-2)sz-=.5;put(e.p,e.tx+1,e.y+1,tv,sz)}}
  else if(e.t=='tbl')e.rows.forEach((r,ri)=>r.forEach((c,ci)=>{const v=clean(q(`[data-t="${ri}-${ci}"]`).value.trim());if(!v)return;let sz=9;while(sz>6&&f.widthOfTextAtSize(v,sz)>c[3])sz-=.5;put(c[0],c[1],c[2],v,sz)}))
 }
 return doc.save();
}
const nm=()=>{const g=i=>(REG.find(e=>e.t=='text'&&e.label==i)&&document.querySelector(`[data-id="${REG.find(e=>e.t=='text'&&e.label==i).id}"]`).value.trim().replace(/[^\w-]+/g,'_'))||'';return ['Family Name','First Name'].map(g).filter(Boolean).join('_')};
const pv=document.getElementById('pv'),pc=document.getElementById('pc'),closePv=()=>{pv.hidden=true;pc.innerHTML='';document.body.style.overflow=''};
document.getElementById('pcl').onclick=closePv;document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!pv.hidden)closePv()});

document.getElementById('pre').onclick=async()=>{
 m.textContent='Building preview\u2026';
 try{const bytes=await make();pc.innerHTML='';pv.hidden=false;document.body.style.overflow='hidden';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const d=await pdfjsLib.getDocument({data:bytes.slice()}).promise,w=Math.min(pc.clientWidth-24,820),r=window.devicePixelRatio||1;
  for(let i=1;i<=d.numPages;i++){const p=await d.getPage(i),s=w/p.getViewport({scale:1}).width,v=p.getViewport({scale:s*r}),c=document.createElement('canvas');
   c.width=v.width;c.height=v.height;c.style.width=w+'px';pc.append(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
  m.textContent=''}
 catch(x){closePv();m.textContent='Preview failed: '+(x&&x.message||x)}
};
document.getElementById('go').onclick=async()=>{
 m.textContent='Generating\u2026';
 try{const bytes=await make(),d=await claude.use('downloads'),name='HyCare_Referral_'+(nm()||'Form')+'.pdf';
  if(!d){m.textContent='Saving files is not available in this view. Open the artifact in claude.ai to download.';return}
  await d.save({filename:name,data:bytes});m.textContent='Done \u2013 PDF ready.'}
 catch(x){m.textContent=x&&x.code=='declined'?'Download cancelled.':'Could not create the PDF: '+(x&&x.message||x)}
};
document.getElementById('clr').onclick=()=>{if(confirm('Clear all entered details?')){document.querySelectorAll('input,textarea').forEach(i=>{i.type=='checkbox'?i.checked=false:i.value=''});m.textContent=''}};
